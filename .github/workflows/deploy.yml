name: Deploy (Podman)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd DiggyNet
            git pull origin main

            podman build -t diggynet-server .
            podman stop diggynet || true
            podman rm diggynet || true
            podman run -d \
              --name diggynet \
              -p 8000:8000 \
              --restart=always \
              diggynet-server
