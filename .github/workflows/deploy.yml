name: Deploy (Podman)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd DiggyNet
            git pull origin main
          
            # Remove any DB file accidentally committed or left behind
            rm -f server/diggynet.db
          
            # Remove old container and image
            podman stop diggynet || true
            podman rm diggynet || true
            podman rmi diggynet-server || true
          
            # Remove old volumes
            podman volume prune -f
          
            # Build fresh image
            podman build --no-cache -t diggynet-server .
          
            # Run new container
            podman run -d \
              --name diggynet \
              -p 8000:8000 \
              --restart=always \
              diggynet-server

